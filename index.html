<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>RTSVR</title>
    <style>
      html,
      body,
      #scene-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background-color: #0a1218;
      }

      /*
        The overlay is authored HERE, not created from TypeScript, and that is
        the entire point: it paints before the module bundle is parsed. RTSVR
        preloads 31 GLBs as `priority: "critical"` and then mesh-merges all of
        them before a single system registers (command_center.glb alone is 233
        meshes collapsed to 15). Until that finishes a TypeScript-built overlay
        would not exist yet, and the player would be looking at the black page
        this replaces — unable to tell a slow load from a hung one.
      */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: #0a1218;
        transition: opacity 0.45s ease;
      }

      #loading-screen.done {
        opacity: 0;
        pointer-events: none;
      }

      /* Styled type, not artwork — RTSVR has no wordmark asset and the loading
         screen was not worth blocking on one. */
      #loading-title {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        font-size: clamp(44px, 11vw, 96px);
        font-weight: 800;
        letter-spacing: 0.16em;
        /* The letter-spacing is applied to the right of each glyph, including
           the last one, which pushes the word visibly off-centre. */
        text-indent: 0.16em;
        color: #e8f4f8;
        margin: 0;
      }

      #loading-status {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #7c93a1;
        margin: 0;
        max-width: min(560px, 82vw);
        text-align: center;
        line-height: 1.6;
      }

      #loading-bar {
        width: min(280px, 60vw);
        height: 4px;
        border-radius: 999px;
        background: rgba(232, 244, 248, 0.16);
        overflow: hidden;
      }

      #loading-bar-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: #7dd3fc;
        transition: width 0.25s ease-out;
      }

      /*
        Indeterminate sweep, used until Phase 2 has a real signal to report.
        **It animates `transform` only, deliberately.** A bar animating `width`
        or `left` needs the main thread — the exact thread blocked by asset
        decode, mesh merging and the first GL upload, which is the work this
        exists to cover. It would freeze precisely when the player most needs to
        see that something is happening. `transform` runs on the compositor and
        keeps sweeping straight through those blocks.
      */
      #loading-bar-fill.indeterminate {
        width: 40%;
        transition: none;
        animation: loading-sweep 1.15s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes loading-sweep {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(255%);
        }
      }

      /*
        Landing chrome. Hidden until the load finishes AND we are out of an
        immersive session AND the match has not begun — see applyLandingChrome.
        z-index sits below the loading overlay's 200 so the splash covers it.
      */
      #landing {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding-bottom: 42px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
      }

      #landing.visible {
        display: flex;
      }

      #enter-vr-button {
        padding: 14px 40px;
        background: #7dd3fc;
        color: #06222e;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      #enter-vr-button:hover {
        background: #a5e4ff;
      }

      #xr-note {
        margin: 0;
        color: #7c93a1;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      /* D7: the version badge is deliberately absent. The slot stays so adding
         it later is one line rather than a layout change. */
      #landing-footer {
        min-height: 18px;
      }

      /* The one accessibility affordance in the whole survey, and it is cheap.
         Motion off means the indicator holds still rather than sweeping. */
      @media (prefers-reduced-motion: reduce) {
        #loading-screen {
          transition: none;
        }
        #loading-bar-fill.indeterminate {
          animation: none;
          width: 100%;
          transform: none;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <p id="xr-note" hidden>No headset detected</p>
      <button id="enter-vr-button" type="button" hidden>ENTER VR</button>
      <div id="landing-footer"></div>
    </div>
    <div id="loading-screen">
      <h1 id="loading-title">RTSVR</h1>
      <div id="loading-bar"><div id="loading-bar-fill"></div></div>
      <p id="loading-status">Loading</p>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
